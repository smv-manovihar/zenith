<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Zenith OG Image</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    :root {
      --bg: #0c0d0e;
      --primary: oklch(0.505 0.213 27.518);
      --foreground: #ffffff;
      --muted: #a1a1aa;
    }

    body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background-color: var(--bg);
      font-family: 'Space Grotesk', -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--foreground);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Grid Effect */
    .grid-bg {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 36px 36px;
      pointer-events: none;
    }

    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 35%, rgba(12, 13, 14, 0.85) 100%);
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 10;
      display: flex;
      align-items: center;
      gap: 60px;
      max-width: 1060px;
      padding: 0 40px;
    }

    /* Sharp App Icon Tile with subtle glow */
    .app-icon {
      width: 196px;
      height: 196px;
      border-radius: 0;
      overflow: hidden;
      border: 1px solid rgba(225, 29, 72, 0.35);
      box-shadow: 
        0 0 28px rgba(225, 29, 72, 0.25),
        0 0 60px rgba(225, 29, 72, 0.1),
        0 20px 40px rgba(0, 0, 0, 0.7);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0c0d0e;
    }

    .app-icon svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Text Block */
    .text-block {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .title {
      font-size: 72px;
      font-weight: 900;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffffff;
      line-height: 1;
    }

    .subtitle {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.2;
      letter-spacing: -0.01em;
    }

    .description {
      font-size: 22px;
      font-weight: 400;
      color: var(--muted);
      line-height: 1.5;
      letter-spacing: -0.01em;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="vignette"></div>

  <div class="container">
    <div class="app-icon">
      <!-- Direct favicon.svg vector with sharp box -->
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="196" height="196">
        <rect fill="#0c0d0e" width="32" height="32"/>
        <g fill="oklch(0.505 0.213 27.518)" transform="translate(6.97, 3) scale(0.3714)">
          <path d="M 48.6 70 L 0 70 L 0 53.2 L 34.6 13.4 L 34.6 11.8 L 1 11.8 L 1 0 L 48.4 0 L 48.4 16.8 L 13.8 56.6 L 13.8 58.2 L 48.6 58.2 L 48.6 70 Z"/>
        </g>
      </svg>
    </div>

    <div class="text-block">
      <div class="title">Zenith</div>
      <div class="subtitle">AniList Sync &amp; Management</div>
      <div class="description">Sync offline watchlists and manage your library.</div>
    </div>
  </div>
</body>
</html>
